<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maintenance | SolarSense AI</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="app.css">
</head>
<body class="app" data-role="user" data-title="Maintenance Requests">
<div id="page" class="content">

  <div class="panel">
    <div class="panel-head"><h3>Raise a maintenance request</h3></div>
    <form id="mForm" class="form-grid" novalidate>
      <div id="mAlert" class="alert full" role="alert"></div>
      <label class="full">Issue title
        <input type="text" id="mTitle" placeholder="e.g. Output dropped after dust storm">
        <span class="err"></span>
      </label>
      <label class="full">Issue description
        <textarea id="mDesc" placeholder="Describe what you noticed and when it started"></textarea>
        <span class="err"></span>
      </label>
      <label>Priority
        <select id="mPri"><option>Low</option><option selected>Medium</option><option>High</option><option>Critical</option></select>
      </label>
      <label>Plant
        <select id="mPlant"></select>
      </label>
      <label>Date
        <input type="date" id="mDate">
        <span class="err"></span>
      </label>
      <div style="display:flex;align-items:flex-end"><button class="btn btn-primary" type="submit">Submit request</button></div>
    </form>
  </div>

  <div class="panel" id="trackPanel" style="display:none">
    <div class="panel-head"><h3 id="tTitle">Request progress</h3><button class="link-btn" type="button" id="tClose">Close</button></div>
    <div class="tracker" id="tracker"></div>
    <p class="note" id="tInfo"></p>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h3>My requests and history</h3>
      <select id="fStatus" aria-label="Filter by status">
        <option value="">All statuses</option><option>Pending</option><option>Assigned</option>
        <option>In Progress</option><option>Resolved</option><option>Closed</option>
      </select>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Request ID</th><th>Issue</th><th>Date</th><th>Priority</th><th>Status</th><th>Technician</th><th></th></tr></thead>
        <tbody id="mBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="api.js"></script>
<script src="auth.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
(async function () {
  if (!window.ME) return;

  const STEPS = ['Pending', 'Assigned', 'In Progress', 'Resolved', 'Closed'];
  const esc = (s) => String(s || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const today = iso(new Date());
  $('mDate').value = today;

  let plants = [];
  try {
    plants = await window.api.getPlants();
    if (plants && plants.length) {
      $('mPlant').innerHTML = plants.map((p) => `<option value="${p.plantId}">${esc(p.plantName)} (${p.plantId})</option>`).join('');
    } else {
      $('mPlant').innerHTML = '<option value="">No plants assigned</option>';
      const btn = $('mForm').querySelector('button[type="submit"]');
      if (btn) btn.disabled = true;
    }
  } catch (err) {
    console.error('Failed to load plants', err);
  }

  let requests = [];

  async function loadMaintenance() {
    try {
      const f = $('fStatus').value;
      requests = await window.api.getMaintenance(f ? { status: f } : {});
      render();
    } catch (err) {
      console.error('Failed to load maintenance requests', err);
    }
  }

  function techCell(m) {
    if (!m.assignedTechnician) return 'Not assigned';
    const phone = m.technicianPhone
      ? '<br><a href="tel:' + esc(m.technicianPhone) + '" style="color:var(--navy)">' + esc(m.technicianPhone) + '</a>'
      : '';
    return '<b>' + esc(m.assignedTechnician) + '</b>' + phone;
  }

  function render() {
    const list = requests;
    $('mBody').innerHTML = (list && list.length) ? list.map((m) => `
      <tr>
        <td><b>${m.requestId}</b></td>
        <td>${esc(m.title)}</td>
        <td>${(m.createdAt || '').slice(0, 10)}</td>
        <td class="pr-${m.priority}">${m.priority}</td>
        <td><span class="st st-${m.status.replace(' ', '')}">${m.status}</span></td>
        <td>${techCell(m)}</td>
        <td><button class="link-btn" style="color:var(--navy)" type="button" data-id="${m.requestId}">Track</button></td>
      </tr>`).join('') : '<tr><td colspan="7" style="color:var(--muted)">No requests found.</td></tr>';
  }

  function track(id) {
    const m = requests.find((x) => x.requestId === id);
    if (!m) return;
    const idx = STEPS.indexOf(m.status);
    $('tTitle').textContent = m.requestId + ': ' + m.title;
    $('tracker').innerHTML = STEPS.map((s, i) => `<div class="tstep ${i < idx ? 'done' : i === idx ? 'now' : ''}">${s}</div>`).join('');
    const latestNote = (m.serviceNotes && m.serviceNotes.length) ? m.serviceNotes[m.serviceNotes.length - 1].text : '';
    const tech = m.assignedTechnician
      ? m.assignedTechnician + (m.technicianPhone ? ' (phone: ' + m.technicianPhone + ')' : '')
      : 'not assigned yet';
    $('tInfo').textContent = 'Priority: ' + m.priority + '. Technician: ' + tech + '. Raised on ' + (m.createdAt || '').slice(0, 10) + '.'
      + (latestNote ? ' Latest service note: ' + latestNote : '');
    $('trackPanel').style.display = 'block';
    $('trackPanel').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  $('mBody').addEventListener('click', (e) => {
    const b = e.target.closest('[data-id]');
    if (b) track(b.dataset.id);
  });
  $('tClose').onclick = () => ($('trackPanel').style.display = 'none');
  $('fStatus').addEventListener('change', loadMaintenance);

  $('mForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const t = $('mTitle'), d = $('mDesc'), box = $('mAlert');
    box.className = 'alert full';
    const r = [
      setErr(t, t.value.trim().length >= 5 ? '' : 'Enter a short issue title (5+ characters).'),
      setErr(d, d.value.trim().length >= 10 ? '' : 'Describe the issue (10+ characters).'),
      setErr($('mPlant'), $('mPlant').value ? '' : 'Choose a plant.')
    ];
    if (r.includes(false)) return;

    const submitBtn = e.target.querySelector('button[type="submit"]');
    if (submitBtn) submitBtn.disabled = true;

    try {
      const created = await window.api.createMaintenance({
        plantId: $('mPlant').value,
        title: t.value.trim(),
        description: d.value.trim(),
        priority: $('mPri').value
      });

      e.target.reset();
      $('mDate').value = today;
      $('mPri').value = 'Medium';
      if (plants && plants.length) $('mPlant').value = plants[0].plantId;
      box.className = 'alert full show ok';
      box.textContent = 'Request ' + created.requestId + ' submitted. Status: Pending.';
      await loadMaintenance();
      track(created.requestId);
    } catch (err) {
      box.className = 'alert full show error';
      box.textContent = err.message || 'Failed to submit request.';
    } finally {
      if (submitBtn) submitBtn.disabled = false;
    }
  });

  await loadMaintenance();
})();
</script>
</body>
</html>
