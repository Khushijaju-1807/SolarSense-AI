<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reports | SolarSense AI</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="app.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="app" data-role="user" data-title="Reports">
<div id="page" class="content">

  <div class="panel">
    <div class="panel-head"><h3>Generate a report</h3></div>
    <div class="filters">
      <label>Report type
        <select id="rType"><option value="monthly">Monthly report</option><option value="yearly">Yearly report</option></select>
      </label>
      <label>Period <select id="rPeriod"></select></label>
      <label>Tariff (&#8377; per kWh) <input type="number" id="rTariff" min="0" step="0.1" value="8"></label>
    </div>
    <div class="rep-actions">
      <button type="button" class="btn btn-primary" id="dlBtn">Download PDF</button>
    </div>
    <div id="rAlert" class="alert" role="alert" style="margin-top:14px"></div>
  </div>

  <div class="panel">
    <div class="panel-head"><h3>Report preview</h3><span class="chip chip-sun" id="rRange"></span></div>
    <div class="stat-grid" id="rStats"></div>
    <h3 style="font-size:16px;margin:22px 0 10px">Maintenance in this period</h3>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Request ID</th><th>Issue</th><th>Date</th><th>Priority</th><th>Status</th></tr></thead>
        <tbody id="rMaint"></tbody>
      </table>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><h3>Report history</h3></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Report ID</th><th>Type</th><th>Period</th><th>Generated</th><th></th></tr></thead>
        <tbody id="rHist"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="api.js"></script>
<script src="auth.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
(async function () {
  if (!window.ME) return;

  const esc = (s) => String(s || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const rs = (n) => 'Rs. ' + Math.round(Number(n) || 0).toLocaleString('en-IN');
  const note = (type, msg) => { const b = $('rAlert'); b.className = 'alert show ' + type; b.textContent = msg; };

  let plant = null;
  let data = [];
  let maintAll = [];

  try {
    const plants = await window.api.getPlants();
    if (plants && plants.length) plant = plants[0];

    if (plant) {
      const [rawEnergy, rawMaint] = await Promise.all([
        window.api.getEnergy({ plantId: plant.plantId }).catch(() => []),
        window.api.getMaintenance().catch(() => [])
      ]);

      data = (rawEnergy || []).map((r) => ({
        date: r.date,
        energy: r.energyGenerated,
        expected: r.expectedEnergy
      }));

      maintAll = (rawMaint || []).map((m) => ({
        id: m.requestId,
        title: m.title,
        date: (m.createdAt || '').slice(0, 10),
        priority: m.priority,
        status: m.status
      }));
    }
  } catch (err) {
    console.error('Failed to load report data', err);
  }

  if (!data.length) {
    $('rStats').innerHTML = '<p class="empty" style="grid-column:1/-1">No energy data available to generate reports.</p>';
    return;
  }

  const monthsAll = monthlyTotals(data).map((m) => m.key).reverse();
  const yearsAll = [...new Set(data.map((r) => r.date.slice(0, 4)))].reverse();
  const label = (type, key) => type === 'monthly'
    ? new Date(key + '-01').toLocaleString('en-US', { month: 'long', year: 'numeric' }) : 'Year ' + key;

  function fillPeriods() {
    const t = $('rType').value, keys = t === 'monthly' ? monthsAll : yearsAll;
    $('rPeriod').innerHTML = keys.map((k) => `<option value="${k}">${label(t, k)}</option>`).join('');
  }

  function compute(type, key, tariff) {
    const rows = data.filter((r) => r.date.startsWith(key));
    if (!rows.length) return null;
    const total = sumKwh(rows), expected = rows.reduce((a, r) => a + r.expected, 0);
    const hi = rows.reduce((a, r) => (r.energy > a.energy ? r : a));
    const lo = rows.reduce((a, r) => (r.energy < a.energy ? r : a));
    const start = rows[0].date, end = rows[rows.length - 1].date;
    const maint = maintAll.filter((m) => m.date >= start && m.date <= end);
    return { type, key, rows, total, expected, hi, lo, start, end, maint, tariff, days: rows.length, savings: total * tariff };
  }

  const current = () => compute($('rType').value, $('rPeriod').value, Math.max(0, +$('rTariff').value || 0));

  function renderPreview() {
    const r = current();
    if (!r) {
      $('rRange').textContent = '';
      $('rStats').innerHTML = '<p class="empty" style="grid-column:1/-1">No data in this period.</p>';
      $('rMaint').innerHTML = '<tr><td colspan="5" style="color:var(--muted)">No records.</td></tr>';
      return;
    }
    $('rRange').textContent = r.start + ' to ' + r.end;
    const card = (l, v, n, g) => `<div class="stat-card ${g ? 'green' : ''}"><small>${l}</small><b>${v}</b><span>${n}</span></div>`;
    $('rStats').innerHTML =
      card('Energy generated', Math.round(r.total).toLocaleString('en-IN'), 'kWh') +
      card('Expected output', Math.round(r.expected).toLocaleString('en-IN'), 'kWh') +
      card('Average per day', (r.total / r.days).toFixed(1), 'kWh') +
      card('Highest day', r.hi.energy.toFixed(1), r.hi.date) +
      card('Savings', inr(r.savings), 'at \u20B9' + r.tariff + '/kWh', true);
    $('rMaint').innerHTML = r.maint.length ? r.maint.map((m) =>
      `<tr><td><b>${m.id}</b></td><td>${esc(m.title)}</td><td>${m.date}</td><td class="pr-${m.priority}">${m.priority}</td>
       <td><span class="st st-${m.status.replace(' ', '')}">${m.status}</span></td></tr>`).join('')
      : '<tr><td colspan="5" style="color:var(--muted)">No maintenance requests in this period.</td></tr>';
  }

  let reportHistory = [];
  async function loadHistory() {
    try {
      reportHistory = await window.api.getReports();
      renderHistory();
    } catch (err) {
      console.error('Failed to load report history', err);
    }
  }

  function renderHistory() {
    $('rHist').innerHTML = (reportHistory && reportHistory.length) ? reportHistory.map((x) => {
      const repKey = (x.options && x.options.key) ? x.options.key : x.startDate.slice(0, 7);
      const repId = x.reportId || ('RPT-' + (x._id ? x._id.slice(-4).toUpperCase() : ''));
      return `<tr>
        <td><b>${repId}</b></td>
        <td>${x.reportType}</td>
        <td>${label(x.reportType, repKey)}</td>
        <td>${(x.generatedAt || '').slice(0, 10)}</td>
        <td><button class="link-btn" style="color:var(--navy)" type="button" data-id="${x._id || repId}">Download again</button></td>
      </tr>`;
    }).join('') : '<tr><td colspan="5" style="color:var(--muted)">No reports generated yet.</td></tr>';
  }

  function makePdf(r) {
    if (!window.jspdf) { return false; }
    const doc = new window.jspdf.jsPDF();
    const W = doc.internal.pageSize.getWidth();
    doc.setFillColor(15, 31, 61); doc.rect(0, 0, W, 30, 'F');
    doc.setTextColor(255); doc.setFontSize(18); doc.text('SolarSense AI', 14, 14);
    doc.setFontSize(10); doc.text((r.type === 'monthly' ? 'Monthly' : 'Yearly') + ' Report: ' + label(r.type, r.key), 14, 22);
    doc.setTextColor(60); doc.setFontSize(9);
    doc.text('Report period: ' + r.start + ' to ' + r.end + '   |   Generated: ' + iso(new Date()), 14, 38);
    doc.text('Prepared for: ' + ME.name + '   |   SolarSense AI Platform', 14, 43);

    const head = { fillColor: [15, 31, 61] };
    doc.autoTable({ startY: 49, head: [['Plant details', '']], headStyles: head, theme: 'grid', body: [
      ['Plant name', plant ? plant.plantName : '-'],
      ['Plant ID', plant ? plant.plantId : '-'],
      ['Location', plant ? plant.location : '-'],
      ['Installed capacity', plant ? (plant.capacity + ' kW') : '-'],
      ['Number of panels', plant ? String(plant.numberOfPanels) : '-'],
      ['Installation date', plant ? plant.installationDate : '-']
    ] });
    doc.autoTable({ startY: doc.lastAutoTable.finalY + 8, head: [['Energy generation', '']], headStyles: head, theme: 'grid', body: [
      ['Total generated', r.total.toFixed(1) + ' kWh'], ['Expected output', r.expected.toFixed(1) + ' kWh'],
      ['Average per day', (r.total / r.days).toFixed(1) + ' kWh'],
      ['Highest day', r.hi.energy.toFixed(1) + ' kWh on ' + r.hi.date], ['Lowest day', r.lo.energy.toFixed(1) + ' kWh on ' + r.lo.date]
    ] });
    doc.autoTable({ startY: doc.lastAutoTable.finalY + 8, head: [['Savings', '']], headStyles: { fillColor: [30, 158, 106] }, theme: 'grid', body: [
      ['Tariff used', 'Rs. ' + r.tariff + ' per kWh'], ['Estimated savings for the period', rs(r.savings)]
    ] });
    doc.autoTable({ startY: doc.lastAutoTable.finalY + 8, head: [['ID', 'Issue', 'Date', 'Priority', 'Status']], headStyles: head, theme: 'grid',
      body: r.maint.length ? r.maint.map((m) => [m.id, m.title, m.date, m.priority, m.status]) : [['No maintenance requests in this period', '', '', '', '']] });

    const detail = r.type === 'monthly'
      ? { head: [['Date', 'Actual (kWh)', 'Expected (kWh)']], body: r.rows.map((x) => [x.date, x.energy, x.expected]) }
      : { head: [['Month', 'Actual (kWh)', 'Expected (kWh)']], body: (() => {
          const g = {}; r.rows.forEach((x) => { const k = x.date.slice(0, 7); g[k] = g[k] || [0, 0]; g[k][0] += x.energy; g[k][1] += x.expected; });
          return Object.entries(g).map(([k, v]) => [k, v[0].toFixed(1), v[1].toFixed(1)]);
        })() };
    doc.addPage();
    doc.setTextColor(15, 31, 61); doc.setFontSize(13);
    doc.text(r.type === 'monthly' ? 'Daily generation' : 'Monthly generation', 14, 18);
    doc.autoTable({ startY: 24, head: detail.head, body: detail.body, headStyles: head, theme: 'striped' });

    const pages = doc.getNumberOfPages();
    for (let i = 1; i <= pages; i++) {
      doc.setPage(i); doc.setFontSize(8); doc.setTextColor(120);
      doc.text('SolarSense AI | Page ' + i + ' of ' + pages, 14, 290);
    }
    doc.save('SolarSense_' + r.type + '_report_' + r.key + '.pdf');
    return true;
  }

  $('dlBtn').onclick = async () => {
    const r = current();
    if (!r) return note('error', 'No data available for this period.');
    if (!makePdf(r)) return note('error', 'PDF library could not load.');

    try {
      await window.api.createReport({
        reportType: r.type,
        plantId: plant ? plant.plantId : '',
        startDate: r.start,
        endDate: r.end,
        options: { tariff: r.tariff, key: r.key }
      });
      note('ok', 'Report generated and downloaded.');
      await loadHistory();
    } catch (err) {
      console.error('Failed to log report to API', err);
    }
  };

  $('rHist').addEventListener('click', (e) => {
    const b = e.target.closest('[data-id]'); if (!b) return;
    const x = reportHistory.find((y) => (y._id === b.dataset.id || y.reportId === b.dataset.id));
    if (!x) return;
    const repKey = (x.options && x.options.key) ? x.options.key : x.startDate.slice(0, 7);
    const tariff = (x.options && x.options.tariff) ? x.options.tariff : 8;
    const repData = compute(x.reportType, repKey, tariff);
    if (repData) makePdf(repData);
  });

  $('rType').addEventListener('change', () => { fillPeriods(); renderPreview(); });
  $('rPeriod').addEventListener('change', renderPreview);
  $('rTariff').addEventListener('input', renderPreview);

  fillPeriods();
  renderPreview();
  await loadHistory();
})();
</script>
</body>
</html>
